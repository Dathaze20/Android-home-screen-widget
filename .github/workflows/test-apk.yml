name: Signed test APK

# Builds ONE release-signed APK of a branch, for the maintainer to install over their own copy,
# and attaches it to the run as an artifact. It publishes nothing: no release, no tag, no deploy.
#
# Why this exists: the Build APK workflow produces a .debug build that installs beside the real
# app, so it cannot test anything about the five pictures in the real app's storage. Testing a
# branch against real data needs the real application ID and the real signing key.
#
# Three things make that safe to do by hand and unsafe to do automatically:
#
#   * It is manual only. There is no push trigger. Only somebody with write access to this
#     repository can start it, and they have to type a confirmation to do so.
#   * It never publishes. No tag is pushed and no release is created or touched.
#   * The versionCode deliberately equals the newest release rather than exceeding it. Android
#     installs an equal versionCode over an existing app, so this replaces the installed build in
#     place and keeps its data — and the NEXT real release still counts as newer, so the in-app
#     updater will still offer it. A test build numbered higher would silently block that.
#
# Read the warning in the summary before sharing a link to the artifact.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to build, e.g. claude/saved-screen-activation"
        required: true
      confirm:
        description: "Type: build a signed test apk"
        required: true

# No contents: write. This workflow has no business changing anything in the repository.
permissions:
  contents: read

env:
  # The certificate every public release has carried since v1.0.8. A test build has to match it
  # or it will not install over the real app — and if it ever does not match, something is wrong
  # enough to stop for. Not a secret: it is readable from any published APK.
  EXPECTED_PUBLIC_CERT_SHA256: "434c6877651f157ce57bf3efefa81053a004e98902b01fd14359f44b49003898"

jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation was typed
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -uo pipefail
          if [ "$CONFIRM" != "build a signed test apk" ]; then
            echo "::error::Confirmation not given. Nothing was built."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      # Equal to the newest release, not above it. See the note at the top of this file.
      - name: Work out the version
        id: version
        run: |
          set -uo pipefail
          latest="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::No release tag to match. Refusing to guess a versionCode."
            exit 1
          fi
          name="${latest#v}"
          major="${name%%.*}"; rest="${name#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          code=$(( major * 10000 + minor * 100 + patch ))
          short="$(git rev-parse --short HEAD)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name-test.$short" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "::notice::building $name-test.$short as versionCode $code (same as $latest, so it installs over it and the next real release still counts as newer)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require the public signing key
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEYPASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          missing=""
          [ -n "$B64" ]       || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$STOREPASS" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ]     || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEYPASS" ]   || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Cannot build a test APK: missing repository secret(s):$missing"
            exit 1
          fi
          echo "::notice::public signing key present"

      - name: Run unit tests
        run: ./gradlew testPublicDebugUnitTest --no-daemon

      - name: Build and verify the signed test APK
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -uo pipefail
          fail=0
          note() { echo "::notice::$*"; }
          err()  { echo "::error::$*"; fail=1; }

          # Outside the workspace and removed however this step ends, so it cannot be collected
          # by the upload step or left in the build directory.
          store="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$B64" | base64 -d > "$store" \
            || { echo "::error::keystore secret is not valid base64"; exit 1; }
          export RELEASE_KEYSTORE_PATH="$store"

          ./gradlew assemblePublicRelease --no-daemon

          apk="app/build/outputs/apk/public/release/app-public-release.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          if [ ! -f "$apk" ]; then
            echo "::error::no signed APK at $apk — the key was not picked up"
            exit 1
          fi

          certs="$("$tools/apksigner" verify --print-certs "$apk" 2>&1)" || err "apksigner verify failed"
          digest="$(printf '%s\n' "$certs" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          canon() { printf '%s' "${1:-}" | tr -d ': \t\r\n' | tr 'A-Z' 'a-z'; }
          note "apk signer sha256 = ${digest:-none}"
          [ "$(canon "$digest")" = "$(canon "$EXPECTED_PUBLIC_CERT_SHA256")" ] \
            || err "signed with a different key than the installed app — it would not install over it"

          pkg="$("$tools/aapt2" dump packagename "$apk" 2>/dev/null | tr -d '\r\n')"
          note "applicationId = ${pkg:-unknown}"
          [ "$pkg" = "io.github.dathaze20.pagewallpaper" ] || err "applicationId is '$pkg'"

          built="$("$tools/aapt2" dump badging "$apk" 2>/dev/null | grep -oP "versionCode='\\K[0-9]+" | head -1)"
          note "versionCode = ${built:-none} (expected ${{ steps.version.outputs.code }})"
          [ "$built" = "${{ steps.version.outputs.code }}" ] || err "versionCode is '$built'"

          inspector="$(unzip -l "$apk" | grep -ciE 'ui_ui-tooling(-data)?\.version' || true)"
          [ "$inspector" = "0" ] || err "Compose layout inspector is packaged"

          mkdir -p dist
          # Named so it cannot be mistaken for a release asset. UpdateAssets looks for "-public-"
          # in a release asset's name; this is not a release asset and must not look like one.
          cp "$apk" "dist/page-wallpaper-TESTBUILD-${{ steps.version.outputs.short }}.apk"
          ls -l dist
          exit $fail

      - name: Say plainly what this is
        run: |
          {
            echo "## Signed test APK — not a release"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Built from | \`${{ github.event.inputs.ref }}\` @ \`${{ steps.version.outputs.short }}\` |"
            echo "| applicationId | \`io.github.dathaze20.pagewallpaper\` |"
            echo "| versionCode | ${{ steps.version.outputs.code }} (same as the newest release) |"
            echo "| versionName | ${{ steps.version.outputs.name }} |"
            echo
            echo "Installs over the released app and keeps its data. The next real release still"
            echo "counts as newer, so the in-app updater keeps working."
            echo
            echo "> **This repository is public, so anyone who can read it can download this"
            echo "> artifact while it exists.** It is genuinely signed with the release key, so"
            echo "> treat it as something you have handed out. It is kept for 1 day."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test APK
        uses: actions/upload-artifact@v4
        with:
          name: page-wallpaper-TESTBUILD-${{ steps.version.outputs.short }}
          path: dist/*.apk
          if-no-files-found: error
          # Deliberately short: a release-signed build of unreviewed code should not sit around.
          retention-days: 1

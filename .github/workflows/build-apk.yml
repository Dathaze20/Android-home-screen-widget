name: Build APK

# Builds an installable debug APK of the public build on every push, so the app can be produced
# without a computer: open the run, download the artifact, install it.
#
# What this produces is never the official app. Debug builds carry a ".debug" applicationId
# suffix (see app/build.gradle.kts), so one installs beside io.github.dathaze20.pagewallpaper
# rather than on top of it, and no artifact here can be mistaken for what a release publishes.
# Releases are built by release.yml alone, from the release variant and the private key.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A branch build has to be installable over whatever is on the phone, and Android refuses
      # a lower versionCode outright: "App not installed", with nothing to say why. Without this
      # every branch APK was stamped with Gradle's fallback 10000 and could not be installed over
      # any release since v1.0.0. One above the newest tag installs over the current release, and
      # is equal to what that next release will carry, which Android accepts as a reinstall.
      - name: Work out a version for this build
        id: dev
        run: |
          set -uo pipefail
          git fetch --tags --quiet origin || true
          latest="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::notice::no tags found; using the Gradle fallback version"
            echo "code=10000" >> "$GITHUB_OUTPUT"
            echo "name=1.0.0-dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="${latest#v}"
          major="${name%%.*}"; rest="${name#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          code=$(( major * 10000 + minor * 100 + patch + 1 ))
          echo "::notice::building as versionCode $code (one above $latest)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=${name}-dev" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Catches a definition deleted while its callers survive — the shape that has broken
      # this build twice, and that the brace and named-argument checks both miss.
      - name: Check for dangling references
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 scripts/check-dangling-refs.py origin/main

      - name: Run unit tests
        # No --stacktrace: it buries the handful of "e: file://..." compiler lines under ~160
        # lines of Gradle internals, which makes a failure unreadable from the log tail. The
        # output is kept so the step below can surface just the errors.
        run: set -o pipefail; ./gradlew testPublicDebugUnitTest --no-daemon 2>&1 | tee compile.log

      # Emitted as ::error:: as well as printed, so a failure is readable from the run's
      # annotations without opening the log. Gradle's own "What went wrong" is included,
      # because an incompatible plugin fails there rather than in the compiler.
      - name: Show what failed
        if: failure()
        run: |
          set +e
          echo "::group::compiler"
          grep -E '^(e|w): ' compile.log | head -40
          echo "::endgroup::"
          grep -E '^e: ' compile.log | head -12 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::group::gradle"
          sed -n '/FAILURE: Build failed/,$p' compile.log | head -40
          echo "::endgroup::"
          sed -n '/What went wrong/,/^\* Try/p' compile.log | head -12 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          grep -iE 'requires Gradle|requires Java|minimum supported|Unsupported class file|incompatible' \
            compile.log | sort -u | head -6 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0

      - name: Verify tests actually executed
        run: |
          results="app/build/test-results/testPublicDebugUnitTest"
          if [ ! -d "$results" ]; then
            echo "No test results directory: the test task did not run."; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          failures=$(grep -ho 'failures="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          errors=$(grep -ho 'errors="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "tests=$total failures=$failures errors=$errors"
          if [ "${total:-0}" -lt 1 ]; then echo "No tests executed."; exit 1; fi
          if [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then exit 1; fi
          echo "$total tests executed, all passing."


      - name: Build debug APK
        env:
          APP_VERSION_NAME: ${{ steps.dev.outputs.name }}
          APP_VERSION_CODE: ${{ steps.dev.outputs.code }}
        run: set -o pipefail; ./gradlew assemblePublicDebug --no-daemon 2>&1 | tee -a compile.log

      # Built here too, so what gets published is proven on every push rather than first tried
      # at release time. These are the same content checks the release workflow runs before it
      # attaches anything; the signing check is the one thing missing, because the private key
      # is not available here and must not be. Unsigned is expected and is not a failure.
      # Results come out as ::notice:: so they are readable without opening the log.
      - name: Build the public release APK and check what it contains
        env:
          APP_VERSION_NAME: ${{ steps.dev.outputs.name }}
          APP_VERSION_CODE: ${{ steps.dev.outputs.code }}
        run: |
          set -o pipefail
          ./gradlew assemblePublicRelease --no-daemon 2>&1 | tee -a compile.log
          # No `set -e`: a check that passes must not look like a failure. The previous version
          # used `grep -q ... && { exit 1; }`, and grep returning 1 for "found nothing" — the
          # good case — took the whole script down with it.
          set -uo pipefail
          fail=0
          note() { echo "::notice::$*"; }
          err()  { echo "::error::$*"; fail=1; }

          dir="app/build/outputs/apk/public/release"
          apk="$dir/app-public-release.apk"
          [ -f "$apk" ] || apk="$dir/app-public-release-unsigned.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          note "build-tools $(basename "$tools")"
          if [ ! -f "$apk" ]; then err "no public release APK in $dir"; ls -l "$dir" || true; exit 1; fi
          note "checking $(basename "$apk")"

          # The identity the release must keep. No suffix on a release build, whatever the
          # debug build type does.
          pkg="$("$tools/aapt2" dump packagename "$apk" 2>/dev/null | tr -d '\r\n')"
          note "release applicationId = ${pkg:-unknown}"
          [ "$pkg" = "io.github.dathaze20.pagewallpaper" ] \
            || err "release applicationId is '$pkg', expected io.github.dathaze20.pagewallpaper"

          label="$("$tools/aapt2" dump badging "$apk" 2>/dev/null \
            | grep -oP "application-label:'\\K[^']+" | head -1)"
          note "release label = ${label:-none}"
          [ "$label" = "Page Wallpaper" ] || err "release label is '$label', expected 'Page Wallpaper'"

          # AndroidX drops a META-INF/<group>_<artifact>.version marker per library, so this
          # names what is actually packaged. Matched precisely: ui-tooling-preview is only the
          # @Preview annotation and is an ordinary dependency, while ui-tooling and
          # ui-tooling-data are the layout inspector and have no business in a release.
          found="$(unzip -l "$apk" | grep -oiE '[A-Za-z0-9_.-]*ui-tooling[A-Za-z0-9_.-]*' \
            | sort -u | tr '\n' ' ')"
          note "ui-tooling entries: ${found:-none}"
          inspector="$(unzip -l "$apk" | grep -ciE 'ui_ui-tooling(-data)?\.version' || true)"
          [ "$inspector" = "0" ] || err "Compose layout inspector is packaged in the release APK"

          built="$("$tools/aapt2" dump badging "$apk" 2>/dev/null \
            | grep -oP "versionCode='\\K[0-9]+" | head -1)"
          note "versionCode = ${built:-unknown} (must exceed the installed release to install over it)"
          [ "$built" = "${{ steps.dev.outputs.code }}" ] \
            || err "versionCode is '$built', expected ${{ steps.dev.outputs.code }}"

          rel=$(stat -c%s "$apk")
          note "release APK = $rel bytes ($((rel / 1000000)) MB); v1.0.4 was 56665788"
          [ "$rel" -lt 50000000 ] || err "release APK is not materially smaller than the 56.6 MB it replaces"
          dbg=$(stat -c%s app/build/outputs/apk/public/debug/app-public-debug.apk 2>/dev/null || echo 0)
          note "debug APK = $dbg bytes; saved $((dbg - rel)) bytes"
          exit $fail

      # The debug artifact this run uploads must be unmistakably not the official app. If the
      # suffix is ever dropped, a branch build would take the real package name with the wrong
      # signing key, and the release APK could no longer be installed over it.
      - name: Check the debug build cannot pose as the release
        run: |
          set -uo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          dbg="app/build/outputs/apk/public/debug/app-public-debug.apk"
          id="$("$tools/aapt2" dump packagename "$dbg" 2>/dev/null | tr -d '\r\n')"
          echo "::notice::debug applicationId = ${id:-unknown}"
          [ "$id" = "io.github.dathaze20.pagewallpaper.debug" ] \
            || { echo "::error::debug applicationId is '$id'; it must not be the released one"; exit 1; }

      # Compiled so the flavour the maintainer's older install still uses does not rot. It is
      # not uploaded and is not published: releases carry the public build alone.
      - name: Check the legacy personal flavour still builds
        env:
          APP_VERSION_NAME: ${{ steps.dev.outputs.name }}
          APP_VERSION_CODE: ${{ steps.dev.outputs.code }}
        run: |
          set -o pipefail
          ./gradlew assemblePersonalDebug --no-daemon 2>&1 | tee -a compile.log
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          pers="app/build/outputs/apk/personal/debug/app-personal-debug.apk"
          id="$("$tools/aapt2" dump packagename "$pers" 2>/dev/null | tr -d '\r\n')"
          echo "::notice::personal flavour applicationId = ${id:-unknown}"
          [ "$id" = "com.dathaze.pagewall.debug" ] \
            || { echo "::error::personal debug applicationId is '$id'"; exit 1; }

      # Always, not just on failure: a green tick proves the task succeeded, not that any
      # test actually ran. Gradle reports success on a cache hit too, so the report is the
      # only evidence of how many tests executed.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/

      # The only APK this workflow hands out, and it is a development build: ".debug"
      # applicationId, debug key, installs beside the real app. No release-variant APK is
      # uploaded, so nothing here can be mistaken for the file a GitHub Release carries.
      - name: Upload the development APK
        uses: actions/upload-artifact@v4
        with:
          name: page-wallpaper-public-debug-apk
          path: app/build/outputs/apk/public/debug/*.apk
          if-no-files-found: error

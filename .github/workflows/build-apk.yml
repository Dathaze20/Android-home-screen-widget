name: Build APK

# Builds an installable debug APK on every push, so the app can be produced
# without a computer: open the run, download the artifact, install it.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Catches a definition deleted while its callers survive — the shape that has broken
      # this build twice, and that the brace and named-argument checks both miss.
      - name: Check for dangling references
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 scripts/check-dangling-refs.py origin/main

      - name: Run unit tests
        # No --stacktrace: it buries the handful of "e: file://..." compiler lines under ~160
        # lines of Gradle internals, which makes a failure unreadable from the log tail. The
        # output is kept so the step below can surface just the errors.
        run: set -o pipefail; ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee compile.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "::group::Kotlin compiler errors"
          grep -E '^(e|w): ' compile.log | head -60 || echo "(no compiler diagnostics found)"
          echo "::endgroup::"

      - name: Verify tests actually executed
        run: |
          results="app/build/test-results/testDebugUnitTest"
          if [ ! -d "$results" ]; then
            echo "No test results directory: the test task did not run."; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          failures=$(grep -ho 'failures="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          errors=$(grep -ho 'errors="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "tests=$total failures=$failures errors=$errors"
          if [ "${total:-0}" -lt 1 ]; then echo "No tests executed."; exit 1; fi
          if [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then exit 1; fi
          echo "$total tests executed, all passing."


      - name: Build debug APK
        run: set -o pipefail; ./gradlew assembleDebug --no-daemon 2>&1 | tee -a compile.log

      # Built here too, so what gets published is proven on every push rather than first tried
      # at release time. Same checks the release workflow runs before it attaches anything.
      - name: Build release APK and check what it contains
        run: |
          set -e
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee -a compile.log
          apk="app/build/outputs/apk/release/app-release.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          "$tools/apksigner" verify --print-certs "$apk"
          digest="$("$tools/apksigner" verify --print-certs "$apk" \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          expected="$(keytool -list -v -keystore app/debug.keystore -storepass android \
            -alias androiddebugkey 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')"
          [ "$digest" = "$expected" ] || { echo "Release APK signed with the wrong key."; exit 1; }

          pkg="$("$tools/aapt2" dump packagename "$apk")"
          [ "$pkg" = "com.dathaze.pagewall" ] || { echo "applicationId changed: $pkg"; exit 1; }

          unzip -l "$apk" | grep -qi 'ui-tooling' && { echo "Debug tooling packaged."; exit 1; }

          debug_bytes=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          rel_bytes=$(stat -c%s "$apk")
          echo "package=$pkg signed=ok tooling=absent"
          echo "debug APK:   $debug_bytes bytes"
          echo "release APK: $rel_bytes bytes"
          echo "saved:       $((debug_bytes - rel_bytes)) bytes"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: page-wallpaper-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Always, not just on failure: a green tick proves the task succeeded, not that any
      # test actually ran. Gradle reports success on a cache hit too, so the report is the
      # only evidence of how many tests executed.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: page-wallpaper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

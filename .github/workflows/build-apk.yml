name: Build APK

# Builds an installable debug APK on every push, so the app can be produced
# without a computer: open the run, download the artifact, install it.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A branch build has to be installable over whatever is on the phone, and Android refuses
      # a lower versionCode outright: "App not installed", with nothing to say why. Without this
      # every branch APK was stamped with Gradle's fallback 10000 and could not be installed over
      # any release since v1.0.0. One above the newest tag installs over the current release, and
      # is equal to what that next release will carry, which Android accepts as a reinstall.
      - name: Work out a version for this build
        id: dev
        run: |
          set -uo pipefail
          git fetch --tags --quiet origin || true
          latest="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::notice::no tags found; using the Gradle fallback version"
            echo "code=10000" >> "$GITHUB_OUTPUT"
            echo "name=1.0.0-dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name="${latest#v}"
          major="${name%%.*}"; rest="${name#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
          code=$(( major * 10000 + minor * 100 + patch + 1 ))
          echo "::notice::building as versionCode $code (one above $latest)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=${name}-dev" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Catches a definition deleted while its callers survive — the shape that has broken
      # this build twice, and that the brace and named-argument checks both miss.
      - name: Check for dangling references
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 scripts/check-dangling-refs.py origin/main

      - name: Run unit tests
        # No --stacktrace: it buries the handful of "e: file://..." compiler lines under ~160
        # lines of Gradle internals, which makes a failure unreadable from the log tail. The
        # output is kept so the step below can surface just the errors.
        run: set -o pipefail; ./gradlew testPersonalDebugUnitTest --no-daemon 2>&1 | tee compile.log

      # Emitted as ::error:: as well as printed, so a failure is readable from the run's
      # annotations without opening the log. Gradle's own "What went wrong" is included,
      # because an incompatible plugin fails there rather than in the compiler.
      - name: Show what failed
        if: failure()
        run: |
          set +e
          echo "::group::compiler"
          grep -E '^(e|w): ' compile.log | head -40
          echo "::endgroup::"
          grep -E '^e: ' compile.log | head -12 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::group::gradle"
          sed -n '/FAILURE: Build failed/,$p' compile.log | head -40
          echo "::endgroup::"
          sed -n '/What went wrong/,/^\* Try/p' compile.log | head -12 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          grep -iE 'requires Gradle|requires Java|minimum supported|Unsupported class file|incompatible' \
            compile.log | sort -u | head -6 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0

      - name: Verify tests actually executed
        run: |
          results="app/build/test-results/testPersonalDebugUnitTest"
          if [ ! -d "$results" ]; then
            echo "No test results directory: the test task did not run."; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          failures=$(grep -ho 'failures="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          errors=$(grep -ho 'errors="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "tests=$total failures=$failures errors=$errors"
          if [ "${total:-0}" -lt 1 ]; then echo "No tests executed."; exit 1; fi
          if [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then exit 1; fi
          echo "$total tests executed, all passing."


      - name: Build debug APK
        env:
          APP_VERSION_NAME: ${{ steps.dev.outputs.name }}
          APP_VERSION_CODE: ${{ steps.dev.outputs.code }}
        run: set -o pipefail; ./gradlew assemblePersonalDebug --no-daemon 2>&1 | tee -a compile.log

      # Built here too, so what gets published is proven on every push rather than first tried
      # at release time. Same checks the release workflow runs before it attaches anything.
      # Built here too, so what gets published is proven on every push rather than first tried
      # at release time. Same checks the release workflow runs before it attaches anything.
      # Results come out as ::notice:: so they are readable without opening the log.
      - name: Build release APK and check what it contains
        env:
          APP_VERSION_NAME: ${{ steps.dev.outputs.name }}
          APP_VERSION_CODE: ${{ steps.dev.outputs.code }}
        run: |
          set -o pipefail
          ./gradlew assemblePersonalRelease --no-daemon 2>&1 | tee -a compile.log
          # No `set -e`: a check that passes must not look like a failure. The previous version
          # used `grep -q ... && { exit 1; }`, and grep returning 1 for "found nothing" — the
          # good case — took the whole script down with it.
          set -uo pipefail
          fail=0
          note() { echo "::notice::$*"; }
          err()  { echo "::error::$*"; fail=1; }

          apk="app/build/outputs/apk/personal/release/app-personal-release.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          note "build-tools $(basename "$tools")"
          if [ ! -f "$apk" ]; then err "no release APK at $apk"; exit 1; fi

          certs="$("$tools/apksigner" verify --print-certs "$apk" 2>&1)" \
            || err "apksigner verify failed: $certs"
          digest="$(printf '%s\n' "$certs" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          expected="$(keytool -list -v -keystore app/debug.keystore -storepass android \
            -alias androiddebugkey 2>/dev/null \
            | grep -iE 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')"
          note "apk signer sha256 = ${digest:-none}"
          note "keystore sha256   = ${expected:-none}"
          if [ -z "$digest" ] || [ "$digest" != "$expected" ]; then
            err "signing identity differs from app/debug.keystore - this would not install over the previous build"
          fi

          pkg="$("$tools/aapt2" dump packagename "$apk" 2>/dev/null | tr -d '\r\n')"
          note "applicationId = ${pkg:-unknown}"
          [ "$pkg" = "com.dathaze.pagewall" ] || err "applicationId is '$pkg', expected com.dathaze.pagewall"

          # The two builds install side by side, so a shared label would leave two identical
          # entries in the launcher and the live wallpaper picker.
          label="$("$tools/aapt2" dump badging "$apk" 2>/dev/null \
            | grep -oP "application-label:'\\K[^']+" | head -1)"
          note "personal label = ${label:-none}"
          [ "$label" = "Page Wallpaper (Personal)" ] \
            || err "personal label is '$label', expected 'Page Wallpaper (Personal)'"

          # AndroidX drops a META-INF/<group>_<artifact>.version marker per library, so this
          # names what is actually packaged. Matched precisely: ui-tooling-preview is only the
          # @Preview annotation and is an ordinary dependency, while ui-tooling and
          # ui-tooling-data are the layout inspector and have no business in a release.
          found="$(unzip -l "$apk" | grep -oiE '[A-Za-z0-9_.-]*ui-tooling[A-Za-z0-9_.-]*' \
            | sort -u | tr '\n' ' ')"
          note "ui-tooling entries: ${found:-none}"
          inspector="$(unzip -l "$apk" | grep -ciE 'ui_ui-tooling(-data)?\.version' || true)"
          [ "$inspector" = "0" ] || err "Compose layout inspector is packaged in the release APK"

          built="$("$tools/aapt2" dump badging "$apk" 2>/dev/null \
            | grep -oP "versionCode='\\K[0-9]+" | head -1)"
          note "versionCode = ${built:-unknown} (must exceed the installed release to install over it)"
          rel=$(stat -c%s "$apk")
          note "release APK = $rel bytes ($((rel / 1000000)) MB); v1.0.4 was 56665788"
          dbg=$(stat -c%s app/build/outputs/apk/personal/debug/app-personal-debug.apk 2>/dev/null || echo 0)
          note "debug APK = $dbg bytes; saved $((dbg - rel)) bytes"
          exit $fail

      # Compiled even though it cannot be signed here: without this the public flavour would
      # only ever be built at release time, and would break quietly in between.
      - name: Check the public flavour still builds
        env:
          APP_VERSION_NAME: ${{ steps.dev.outputs.name }}
          APP_VERSION_CODE: ${{ steps.dev.outputs.code }}
        run: |
          set -o pipefail
          ./gradlew assemblePublicDebug --no-daemon 2>&1 | tee -a compile.log
          pub="app/build/outputs/apk/public/debug/app-public-debug.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          id="$("$tools/aapt2" dump packagename "$pub" 2>/dev/null | tr -d '\r\n')"
          echo "::notice::public flavour applicationId = ${id:-unknown}"
          [ "$id" = "io.github.dathaze20.pagewallpaper" ] \
            || { echo "::error::public flavour applicationId is '$id'"; exit 1; }

          # The canonical product keeps the plain name; only the personal copy is qualified.
          publabel="$("$tools/aapt2" dump badging "$pub" 2>/dev/null \
            | grep -oP "application-label:'\\K[^']+" | head -1)"
          echo "::notice::public flavour label = ${publabel:-none}"
          [ "$publabel" = "Page Wallpaper" ] \
            || { echo "::error::public label is '$publabel', expected 'Page Wallpaper'"; exit 1; }

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: page-wallpaper-release-apk
          path: app/build/outputs/apk/personal/release/*.apk
          if-no-files-found: error

      # Always, not just on failure: a green tick proves the task succeeded, not that any
      # test actually ran. Gradle reports success on a cache hit too, so the report is the
      # only evidence of how many tests executed.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: page-wallpaper-debug-apk
          path: app/build/outputs/apk/personal/debug/*.apk
          if-no-files-found: error

name: Release

# Pushing a tag like v1.0.1 publishes a GitHub Release with the APK attached. That release is
# what the in-app update button reads: without one, "Check for updates" has nothing to find.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          name="${raw#v}"
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$raw' is not v<major>.<minor>.<patch>; the updater could not read it."
            exit 1
          fi
          major="${name%%.*}"
          rest="${name#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "Minor and patch must each stay under 100 to keep version codes ordered."
            exit 1
          fi
          # The same arithmetic as UpdateVersion.codeFromTag. If these ever disagree, the app
          # either misses an update or offers one it already has installed.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building v$name as versionCode $code"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: set -o pipefail; ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee compile.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "::group::Kotlin compiler errors"
          grep -E '^(e|w): ' compile.log | head -60 || echo "(no compiler diagnostics found)"
          echo "::endgroup::"

      - name: Verify tests actually executed
        run: |
          results="app/build/test-results/testDebugUnitTest"
          if [ ! -d "$results" ]; then
            echo "No test results directory: the test task did not run."; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          failures=$(grep -ho 'failures="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          errors=$(grep -ho 'errors="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "tests=$total failures=$failures errors=$errors"
          if [ "${total:-0}" -lt 1 ]; then echo "No tests executed."; exit 1; fi
          if [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then exit 1; fi

      # Deliberately the debug variant: it is signed with the checked-in debug.keystore, which is
      # the same key every build so far has used. A release-signed APK carries a different key and
      # Android refuses to install it over what is already on the phone — the update would fail
      # and the only way through would be an uninstall, which wipes every page assignment.
      - name: Build the APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: set -o pipefail; ./gradlew assembleDebug --no-daemon 2>&1 | tee -a compile.log

      - name: Name the APK after the version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/page-wallpaper-${{ steps.version.outputs.tag }}.apk"
          ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Page Wallpaper ${{ steps.version.outputs.tag }}
          body: |
            versionCode ${{ steps.version.outputs.code }}

            Install over your current copy — page assignments and settings are kept.
            In the app, Settings ⇒ Check for updates will find this release by itself.
          files: dist/*.apk
          fail_on_unmatched_files: true

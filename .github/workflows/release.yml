name: Release

# Pushing a tag like v1.0.10 publishes a GitHub Release with the public APK attached. That
# release is what the in-app update button reads: without one, "Check for updates" has nothing
# to find.
#
# One APK is published, and it is the public build — application ID
# io.github.dathaze20.pagewallpaper, signed with a private key held in repository secrets. The
# personal flavour still exists in the source for development and for the installs that predate
# the split, but it is no longer distributed: a release carrying two APKs meant two update
# channels, two signing identities, and a file somebody could install by mistake and then be
# unable to update.
#
# Releases published before this change are left exactly as they are.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. v1.0.10"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          name="${raw#v}"
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$raw' is not v<major>.<minor>.<patch>; the updater could not read it."
            exit 1
          fi
          major="${name%%.*}"
          rest="${name#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "Minor and patch must each stay under 100 to keep version codes ordered."
            exit 1
          fi
          # The same arithmetic as UpdateVersion.codeFromTag. If these ever disagree, the app
          # either misses an update or offers one it already has installed.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building v$name as versionCode $code"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Checked before anything is built, and fatal rather than skippable.
      #
      # This used to be a conditional: no key meant the public APK was quietly skipped and the
      # personal, debug-signed build was published on its own. That is the one failure mode a
      # release must not have — the fallback is an APK signed with a key that is published in
      # this repository, under a different application ID, offered to everybody. There is no
      # fallback now. No key, no release.
      - name: Require the public signing key
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEYPASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          missing=""
          [ -n "$B64" ]       || missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -n "$STOREPASS" ] || missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ]     || missing="$missing RELEASE_KEY_ALIAS"
          [ -n "$KEYPASS" ]   || missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Cannot publish: missing repository secret(s):$missing"
            exit 1
          fi

          # Not just present — usable. A keystore that is truncated, or a password or alias that
          # is wrong, would otherwise surface as an opaque Gradle signing failure after a full
          # build, or worse, as an unsigned APK.
          store="$RUNNER_TEMP/keycheck.jks"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$B64" | base64 -d > "$store" 2>/dev/null \
            || { echo "::error::RELEASE_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          keytool -list -keystore "$store" -storepass "$STOREPASS" -alias "$ALIAS" >/dev/null 2>&1 \
            || { echo "::error::the keystore, its password or the alias is not usable"; exit 1; }
          echo "::notice::public signing key present and readable"

      # Run against the public variant, because that is the one being published.
      - name: Run unit tests
        run: set -o pipefail; ./gradlew testPublicDebugUnitTest --no-daemon 2>&1 | tee compile.log

      # Emitted as ::error:: as well as printed, so a failure is readable from the run's
      # annotations without opening the log. Gradle's own "What went wrong" is included,
      # because an incompatible plugin fails there rather than in the compiler.
      - name: Show what failed
        if: failure()
        run: |
          set +e
          echo "::group::compiler"
          grep -E '^(e|w): ' compile.log | head -40
          echo "::endgroup::"
          grep -E '^e: ' compile.log | head -12 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::group::gradle"
          sed -n '/FAILURE: Build failed/,$p' compile.log | head -40
          echo "::endgroup::"
          sed -n '/What went wrong/,/^\* Try/p' compile.log | head -12 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          grep -iE 'requires Gradle|requires Java|minimum supported|Unsupported class file|incompatible' \
            compile.log | sort -u | head -6 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 0

      - name: Verify tests actually executed
        run: |
          results="app/build/test-results/testPublicDebugUnitTest"
          if [ ! -d "$results" ]; then
            echo "No test results directory: the test task did not run."; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          failures=$(grep -ho 'failures="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          errors=$(grep -ho 'errors="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "tests=$total failures=$failures errors=$errors"
          if [ "${total:-0}" -lt 1 ]; then echo "No tests executed."; exit 1; fi
          if [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then exit 1; fi
          echo "::notice::$total tests executed, all passing"

      # Each of these is a claim the release makes. A claim that is not checked is a guess.
      #
      # The release variant, not debug: the variant is what keeps Compose's layout-inspector
      # tooling — developer-only, and megabytes of it — out of the APK people actually download.
      - name: Build and verify the public APK
        env:
          B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          # No `set -e`: a check that passes must not look like a failure. An earlier version
          # used `grep -q ... && { exit 1; }`, and grep returning 1 for "found nothing" — the
          # good case — took the whole script down with it.
          set -uo pipefail
          fail=0
          note() { echo "::notice::$*"; }
          err()  { echo "::error::$*"; fail=1; }

          # Written outside the workspace and removed however this step ends, so it cannot be
          # picked up by an upload step or left behind in the build directory.
          store="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$B64" | base64 -d > "$store" \
            || { echo "::error::keystore secret is not valid base64"; exit 1; }
          export RELEASE_KEYSTORE_PATH="$store"

          ./gradlew assemblePublicRelease --no-daemon 2>&1 | tee -a compile.log

          apk="app/build/outputs/apk/public/release/app-public-release.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          note "build-tools $(basename "$tools")"
          if [ ! -f "$apk" ]; then
            # An unsigned output here means Gradle did not see the key at all.
            echo "::error::no signed public release APK at $apk"
            ls -l app/build/outputs/apk/public/release/ || true
            exit 1
          fi

          certs="$("$tools/apksigner" verify --print-certs "$apk" 2>&1)" \
            || err "apksigner verify failed: $certs"
          digest="$(printf '%s\n' "$certs" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          note "apk signer sha256 = ${digest:-none}"
          [ -n "$digest" ] || err "the public APK has no signing certificate"

          # The whole point of the split. If these ever match, the build being published is
          # signed with the key that is published in this repository.
          debugdigest="$(keytool -list -v -keystore app/debug.keystore -storepass android \
            -alias androiddebugkey 2>/dev/null \
            | grep -iE 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')"
          [ "$digest" != "$debugdigest" ] \
            || err "the public APK is signed with the PUBLIC debug key - refusing to publish it"

          pkg="$("$tools/aapt2" dump packagename "$apk" 2>/dev/null | tr -d '\r\n')"
          note "applicationId = ${pkg:-unknown}"
          [ "$pkg" = "io.github.dathaze20.pagewallpaper" ] \
            || err "applicationId is '$pkg', expected io.github.dathaze20.pagewallpaper"

          label="$("$tools/aapt2" dump badging "$apk" 2>/dev/null \
            | grep -oP "application-label:'\\K[^']+" | head -1)"
          note "label = ${label:-none}"
          [ "$label" = "Page Wallpaper" ] || err "label is '$label', expected 'Page Wallpaper'"

          # AndroidX drops a META-INF/<group>_<artifact>.version marker per library, so this
          # names what is actually packaged. Matched precisely: ui-tooling-preview is only the
          # @Preview annotation and is an ordinary dependency, while ui-tooling and
          # ui-tooling-data are the layout inspector and have no business in a release.
          found="$(unzip -l "$apk" | grep -oiE '[A-Za-z0-9_.-]*ui-tooling[A-Za-z0-9_.-]*' \
            | sort -u | tr '\n' ' ')"
          note "ui-tooling entries: ${found:-none}"
          inspector="$(unzip -l "$apk" | grep -ciE 'ui_ui-tooling(-data)?\.version' || true)"
          [ "$inspector" = "0" ] || err "Compose layout inspector is packaged in the release APK"

          rel=$(stat -c%s "$apk")
          note "release APK = $rel bytes ($((rel / 1000000)) MB); v1.0.4 was 56665788"
          [ "$rel" -lt 50000000 ] || err "release APK is not materially smaller than the 56.6 MB it replaces"

          built="$("$tools/aapt2" dump badging "$apk" 2>/dev/null \
            | grep -oP "versionCode='\\K[0-9]+" | head -1)"
          note "versionCode in APK = ${built:-none}; workflow computed ${{ steps.version.outputs.code }}"
          [ "$built" = "${{ steps.version.outputs.code }}" ] \
            || err "versionCode in the APK does not match the tag - the updater compares this number"
          exit $fail

      # The name is a contract, not a label: UpdateAssets.pick looks for "-public-" in it, and
      # an install that cannot find a matching asset is told there is no update. Changing this
      # breaks the update button on every phone already running the app.
      # See UpdateAssetsTest, which pins this exact shape.
      - name: Name the APK after the version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/public/release/app-public-release.apk \
             "dist/page-wallpaper-public-${{ steps.version.outputs.tag }}.apk"
          ls -l dist

      # Written from what the build actually produced, not from a fixed paragraph. The notes
      # used to say the public build "is not published yet" and kept saying it after it was.
      - name: Write the release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -eu
          {
            echo "Page Wallpaper $TAG — versionCode $CODE"
            echo
            echo "## Download"
            echo
            echo "**\`page-wallpaper-public-$TAG.apk\`** — the official build, and the only one."
            echo "Application ID \`io.github.dathaze20.pagewallpaper\`, signed with a private"
            echo "release key that is not in this repository."
            echo
            echo "## Installing"
            echo
            echo "Download the APK on your phone and tap it. Android will ask to allow installs"
            echo "from your browser or file manager; that prompt is normal for anything not from"
            echo "the Play Store."
            echo
            echo "## Updating"
            echo
            echo "Installs over your existing copy. Page assignments, wallpapers and settings are"
            echo "kept, and there is no need to uninstall. In the app,"
            echo "**Menu → Settings → Check for updates** finds this release by itself."
            echo
            echo "## If you are running the old personal build"
            echo
            echo "Releases up to and including v1.0.9 also carried"
            echo "\`page-wallpaper-personal-vX.Y.Z.apk\` (\`com.dathaze.pagewall\`), signed with the"
            echo "debug keystore checked into this repository. That build is no longer published."
            echo
            echo "It **cannot be updated into this one**: different application ID, different"
            echo "signing key. Android treats them as unrelated apps, which is deliberate. To move"
            echo "across without losing anything, export a backup from the personal app"
            echo "(**Settings → Export backup to Downloads**), install this APK alongside it, and"
            echo "import that backup in the new app. Both can stay installed while you check."
            echo "Older releases are left in place and still carry their original files."
          } > NOTES.md
          cat NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Page Wallpaper ${{ steps.version.outputs.tag }}
          body_path: NOTES.md
          files: dist/*.apk
          fail_on_unmatched_files: true

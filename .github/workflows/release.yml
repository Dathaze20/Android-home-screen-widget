name: Release

# Pushing a tag like v1.0.1 publishes a GitHub Release with the APK attached. That release is
# what the in-app update button reads: without one, "Check for updates" has nothing to find.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          name="${raw#v}"
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$raw' is not v<major>.<minor>.<patch>; the updater could not read it."
            exit 1
          fi
          major="${name%%.*}"
          rest="${name#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "Minor and patch must each stay under 100 to keep version codes ordered."
            exit 1
          fi
          # The same arithmetic as UpdateVersion.codeFromTag. If these ever disagree, the app
          # either misses an update or offers one it already has installed.
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building v$name as versionCode $code"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: set -o pipefail; ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee compile.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "::group::Kotlin compiler errors"
          grep -E '^(e|w): ' compile.log | head -60 || echo "(no compiler diagnostics found)"
          echo "::endgroup::"

      - name: Verify tests actually executed
        run: |
          results="app/build/test-results/testDebugUnitTest"
          if [ ! -d "$results" ]; then
            echo "No test results directory: the test task did not run."; exit 1
          fi
          total=$(grep -ho 'tests="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          failures=$(grep -ho 'failures="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          errors=$(grep -ho 'errors="[0-9]*"' "$results"/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "tests=$total failures=$failures errors=$errors"
          if [ "${total:-0}" -lt 1 ]; then echo "No tests executed."; exit 1; fi
          if [ "${failures:-0}" -ne 0 ] || [ "${errors:-0}" -ne 0 ]; then exit 1; fi

      # The release variant, signed with the same checked-in debug.keystore every build has used.
      # The key is what lets an update install over what is on the phone; the variant is what
      # keeps Compose's layout-inspector tooling — developer-only, and megabytes of it — out of
      # the APK people actually download.
      - name: Build the APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: set -o pipefail; ./gradlew assembleRelease --no-daemon 2>&1 | tee -a compile.log

      # Each of these is a claim the release makes. A claim that is not checked is a guess.
      # Each of these is a claim the release makes. A claim that is not checked is a guess.
      - name: Verify the APK before it is published
        run: |
          # No `set -e`: a check that passes must not look like a failure. The previous version
          # used `grep -q ... && { exit 1; }`, and grep returning 1 for "found nothing" — the
          # good case — took the whole script down with it.
          set -uo pipefail
          fail=0
          note() { echo "::notice::$*"; }
          err()  { echo "::error::$*"; fail=1; }

          apk="app/build/outputs/apk/release/app-release.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          note "build-tools $(basename "$tools")"
          if [ ! -f "$apk" ]; then err "no release APK at $apk"; exit 1; fi

          certs="$("$tools/apksigner" verify --print-certs "$apk" 2>&1)" \
            || err "apksigner verify failed: $certs"
          digest="$(printf '%s\n' "$certs" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          expected="$(keytool -list -v -keystore app/debug.keystore -storepass android \
            -alias androiddebugkey 2>/dev/null \
            | grep -iE 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')"
          note "apk signer sha256 = ${digest:-none}"
          note "keystore sha256   = ${expected:-none}"
          if [ -z "$digest" ] || [ "$digest" != "$expected" ]; then
            err "signing identity differs from app/debug.keystore - this would not install over the previous build"
          fi

          pkg="$("$tools/aapt2" dump packagename "$apk" 2>/dev/null | tr -d '\r\n')"
          note "applicationId = ${pkg:-unknown}"
          [ "$pkg" = "com.dathaze.pagewall" ] || err "applicationId is '$pkg', expected com.dathaze.pagewall"

          tooling="$(unzip -l "$apk" | grep -ci 'ui-tooling' || true)"
          note "ui-tooling entries = $tooling"
          [ "$tooling" = "0" ] || err "Compose debug tooling is packaged in the release APK"

          rel=$(stat -c%s "$apk")
          note "release APK = $rel bytes ($((rel / 1000000)) MB); v1.0.4 was 56665788"
          [ "$rel" -lt 50000000 ] || err "release APK is not materially smaller than the 56.6 MB it replaces"

          built="$("$tools/aapt2" dump badging "$apk" 2>/dev/null \
            | grep -oP "versionCode='\\K[0-9]+" | head -1)"
          note "versionCode in APK = ${built:-none}; workflow computed ${{ steps.version.outputs.code }}"
          [ "$built" = "${{ steps.version.outputs.code }}" ] \
            || err "versionCode in the APK does not match the tag - the updater compares this number"
          exit $fail

      - name: Name the APK after the version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/page-wallpaper-${{ steps.version.outputs.tag }}.apk"
          ls -l dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Page Wallpaper ${{ steps.version.outputs.tag }}
          body: |
            versionCode ${{ steps.version.outputs.code }}

            Install over your current copy — page assignments and settings are kept.
            In the app, Settings ⇒ Check for updates will find this release by itself.
          files: dist/*.apk
          fail_on_unmatched_files: true
